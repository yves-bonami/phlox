[package]
name = "phlox-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
phlox-core = { workspace = true }
phlox-runtime = { workspace = true }
phlox-plugin-host = { workspace = true }
axum = { version = "0.8.9", features = ["multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.1", features = ["v4"] }
tokio = { version = "1.54.1", features = ["fs"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
